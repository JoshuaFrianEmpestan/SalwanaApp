name: salwanaapp
description: Salwana - Inventory, merchant finance, reservation and marketplace app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Firebase (cloud backend)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  cloud_functions: ^5.0.4

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10+1

  # Forms / utils
  intl: ^0.19.0
  uuid: ^4.4.2
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2

  # Media / scanning
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Reports / export
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  # Push notifications (local display)
  flutter_local_notifications: ^17.2.2

  # Opening report download links
  url_launcher: ^6.3.0
  web: ^1.1.1

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  http_parser: ^4.1.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
